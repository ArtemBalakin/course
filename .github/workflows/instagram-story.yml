name: Export AB Digital Instagram Story
on:
  push:
    branches:
      - design/instagram-story-real-projects
    paths:
      - 'story/**'
      - '.github/workflows/instagram-story.yml'
  workflow_dispatch:
jobs:
  export-story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-inter fonts-dejavu-core || sudo apt-get install -y fonts-dejavu-core
          python -m pip install pillow
      - name: Render from original project screenshots
        run: python story/render_story.py
      - name: Save full-resolution PNG
        uses: actions/upload-artifact@v4
        with:
          name: ab-digital-instagram-story
          path: story/ab-digital-instagram-story.png
