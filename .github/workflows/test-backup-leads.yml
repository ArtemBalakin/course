name: Validate independent backup lead intake
on:
  push:
    paths:
      - workers/leads/**
      - .github/workflows/test-backup-leads.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check workers/leads/src/index.js
          node --test workers/leads/test/*.test.mjs
