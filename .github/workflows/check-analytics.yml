name: Verify live Metrica installation
on:
  push:
    paths:
      - .github/workflows/check-analytics.yml
      - scripts/check-analytics.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Metrica bootstrap and live pages
        run: node scripts/check-analytics.mjs
