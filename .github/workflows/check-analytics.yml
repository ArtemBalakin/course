name: Verify live analytics beacon
on:
  push:
    paths:
      - .github/workflows/check-analytics.yml
      - scripts/check-analytics.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Inspect Cloudflare beacon in both real browsers
        run: node scripts/check-analytics.mjs
