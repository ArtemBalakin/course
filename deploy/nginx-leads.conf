# Подключается внутри server { listen 443 ... } сайта: include /opt/ab-digital/deploy/nginx-leads.conf;
# Наружу открыт только приём заявок. /health доступен лишь с самого сервера: 127.0.0.1:8091.
location = /api/lead {
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32k;
}
