services:
  - type: web
    runtime: static
    name: ab-digital-preview
    branch: develop
    buildCommand: echo "Static website — no build required"
    staticPublishPath: ./site
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
